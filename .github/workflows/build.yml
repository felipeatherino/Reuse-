name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar Licenças
        run: yes | sdkmanager --licenses || true

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Projeto Android Nativo
        run: npx expo prebuild --platform android --clean

      - name: Permissão Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: App-Instalavel-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Configurar Memoria do Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Dar Permissao ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Salvar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: App-Instalavel-APK
          path: android/app/build/outputs/apk/debug/*.apk
